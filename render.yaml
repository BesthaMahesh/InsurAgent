services:
  # 1. InsurAgent Streamlit Web Application (Frontend + Embedded In-Process Agent Engine)
  - type: web
    name: insuragent-frontend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL_NAME
        value: llama-3.3-70b-versatile
      - key: ADMIN_AUTH_PASSWORD
        value: "123456"
      - key: USER_AUTH_PASSWORD
        value: "12345"
      - key: CHROMA_TELEMETRY_ENABLED
        value: "false"
      - key: ANONYMIZED_TELEMETRY
        value: "False"

  # 2. InsurAgent REST API (FastAPI Backend)
  - type: web
    name: insuragent-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL_NAME
        value: llama-3.3-70b-versatile
      - key: CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: HIGH_RISK_THRESHOLD
        value: "0.60"
      - key: CHROMA_TELEMETRY_ENABLED
        value: "false"
      - key: ANONYMIZED_TELEMETRY
        value: "False"
