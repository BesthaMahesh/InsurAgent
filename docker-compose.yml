version: '3.8'

services:
  backend:
    build: .
    container_name: insuragent-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MODEL_NAME=llama-3.3-70b-versatile
      - DATABASE_URL=sqlite:///./data/insuragent.db
      - CHROMA_DB_PATH=./data/chromadb
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build: .
    container_name: insuragent-frontend
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./data:/app/data
    restart: unless-stopped
